x-browser-extension-tool: &browser-extension-tool
  build: .
  image: escpost-browser-extension-development
  network_mode: host
  user: "0:0"
  working_dir: /workspace
  entrypoint: /workspace/scripts/docker-entrypoint.sh
  volumes:
    - .:/workspace
    - node-modules:/workspace/node_modules

services:
  build:
    <<: *browser-extension-tool
    profiles: [browser-extension-tools]
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]

  test:
    <<: *browser-extension-tool
    profiles: [browser-extension-tools]
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run typecheck && bun run test"]

  package:
    <<: *browser-extension-tool
    profiles: [browser-extension-tools]
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run package"]

  pages:
    image: python:3.13-alpine
    network_mode: host
    profiles: [browser-extension-tools]
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
    command:
      - sh
      - -c
      - |
        test -f /workspace/sdks/javascript/dist/index.js || {
          echo "Missing sdks/javascript/dist/index.js; run: just javascript-sdk-build" >&2
          exit 1
        }
        test -f /workspace/browser-extension/dist/chrome/manifest.json || {
          echo "Missing browser-extension/dist/chrome/manifest.json; run: just browser-extension build" >&2
          exit 1
        }
        exec python -m http.server 8081 --bind 127.0.0.1

volumes:
  node-modules:
