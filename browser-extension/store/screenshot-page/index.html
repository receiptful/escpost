<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rowan &amp; Fig Coffee — Till</title>
    <style>
      :root {
        --page: #f4f4f6;
        --surface: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #6b6b70;
        --ink-faint: #8e8e94;
        --line: #e4e4e7;
        --line-strong: #d3d3d8;
        --accent: #18794e;
        --accent-strong: #14653f;
        --accent-soft: #edf6f1;
        --warning: #9a6700;
        --error: #b42318;

        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
      }

      * { box-sizing: border-box; }

      /* The layout is exactly 1280 x 800 pixels. The screenshot shows this
         area. A taller window shows the page background below it. */
      body {
        background: var(--page);
        display: flex;
        flex-direction: column;
        height: 800px;
        margin: 0;
      }

      /* The top bar holds the shop name, the till number and the cashier.
         All of it stays on the left side of the window. */
      .topbar {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex: none;
        gap: 1.25rem;
        height: 54px;
        padding: 0 1.5rem;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 0.625rem;
      }

      .brand-mark {
        color: var(--accent);
        display: block;
      }

      .brand-name {
        font-size: 1.0625rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .topbar-divider {
        background: var(--line);
        height: 22px;
        width: 1px;
      }

      .topbar-facts {
        color: var(--ink-soft);
        display: flex;
        font-size: 0.875rem;
        gap: 1.25rem;
      }

      .topbar-facts b {
        color: var(--ink);
        font-weight: 550;
      }

      .workspace {
        display: grid;
        flex: 1;
        gap: 1.25rem;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 0;
        padding: 1.25rem 1.5rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      /* Left column: the open order. */
      .order {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 1.25rem 1.5rem 1rem;
      }

      .order-head {
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        padding-bottom: 0.875rem;
      }

      .order-title {
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .order-meta {
        color: var(--ink-soft);
        font-size: 0.875rem;
      }

      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        width: 100%;
      }

      thead th {
        color: var(--ink-faint);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        padding: 0.6875rem 0 0.4375rem;
        text-align: left;
        text-transform: uppercase;
      }

      tbody td {
        border-top: 1px solid var(--line);
        padding: 0.375rem 0;
      }

      .col-qty { width: 4rem; }

      .col-unit,
      .col-amount {
        text-align: right;
        white-space: nowrap;
      }

      .col-unit { color: var(--ink-soft); width: 7rem; }
      .col-amount { font-weight: 550; width: 7rem; }

      .item-name { font-weight: 500; }

      .item-note {
        color: var(--ink-faint);
        font-size: 0.8125rem;
      }

      .qty-pill {
        background: var(--page);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        display: inline-block;
        font-size: 0.875rem;
        font-weight: 600;
        min-width: 2rem;
        padding: 0.125rem 0.375rem;
        text-align: center;
      }

      .order-foot { margin-top: auto; }

      .totals {
        border-top: 1px solid var(--line-strong);
        font-variant-numeric: tabular-nums;
        margin-top: 0.625rem;
        padding-top: 0.875rem;
      }

      .totals-row {
        color: var(--ink-soft);
        display: flex;
        font-size: 0.9375rem;
        justify-content: space-between;
        padding: 0.125rem 0;
      }

      .totals-row.grand {
        align-items: baseline;
        border-top: 1px solid var(--line);
        color: var(--ink);
        font-size: 1rem;
        font-weight: 600;
        margin-top: 0.375rem;
        padding-top: 0.625rem;
      }

      .grand-amount {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* The printer state. It is small and it says what the library reports. */
      .printer-state {
        align-items: center;
        border-top: 1px solid var(--line);
        color: var(--ink-soft);
        display: flex;
        font-size: 0.8125rem;
        gap: 0.5rem;
        margin-top: 0.625rem;
        padding-top: 0.625rem;
      }

      .dot {
        background: var(--ink-faint);
        border-radius: 50%;
        flex: none;
        height: 8px;
        width: 8px;
      }

      [data-tone="ok"] .dot { background: var(--accent); }
      [data-tone="ok"] .printer-state-text { color: var(--accent); }
      [data-tone="warning"] .dot { background: var(--warning); }
      [data-tone="warning"] .printer-state-text { color: var(--warning); }
      [data-tone="error"] .dot { background: var(--error); }
      [data-tone="error"] .printer-state-text { color: var(--error); }

      /* Right column: payment. The panel starts below the middle of the
         window, thus the upper right part stays clear. */
      .payment-column {
        align-items: end;
        display: grid;
        min-height: 0;
      }

      .payment {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 360px;
        padding: 1.25rem;
        width: 100%;
      }

      .payment-block + .payment-block {
        border-top: 1px solid var(--line);
        margin-top: 1rem;
        padding-top: 1rem;
      }

      .payment-note {
        color: var(--ink-faint);
        font-size: 0.8125rem;
        margin-top: 0.375rem;
      }

      .payment-title {
        color: var(--ink-faint);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .amount-due {
        align-items: baseline;
        display: flex;
        justify-content: space-between;
        margin-top: 0.5rem;
      }

      .amount-due span {
        color: var(--ink-soft);
        font-size: 0.9375rem;
      }

      .amount-due strong {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .methods {
        display: grid;
        gap: 0.625rem;
        grid-template-columns: 1fr 1fr;
        margin-top: 0.625rem;
      }

      button {
        cursor: pointer;
        font: inherit;
      }

      .method {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        display: flex;
        font-weight: 550;
        gap: 0.5rem;
        justify-content: center;
        padding: 0.6875rem 0.5rem;
      }

      .method[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .print {
        align-items: center;
        background: var(--accent);
        margin-top: 0.625rem;
        border: 1px solid var(--accent-strong);
        border-radius: 10px;
        color: #ffffff;
        display: flex;
        font-size: 1.0625rem;
        font-weight: 600;
        gap: 0.5rem;
        justify-content: center;
        padding: 0.875rem 1rem;
        width: 100%;
      }

      .print:hover { background: var(--accent-strong); }

      .print-state {
        color: var(--ink-soft);
        font-size: 0.8125rem;
        margin: 0.625rem 0 0;
        min-height: 1.25em;
        text-align: center;
      }

      .print-state[data-tone="ok"] { color: var(--accent); }
      .print-state[data-tone="warning"] { color: var(--warning); }
      .print-state[data-tone="error"] { color: var(--error); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9Z"></path>
          <path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2"></path>
          <path d="M7 3v2.5M11 3v2.5"></path>
        </svg>
        <span class="brand-name">Rowan &amp; Fig Coffee</span>
      </div>
      <div class="topbar-divider"></div>
      <div class="topbar-facts">
        <div>Till <b>2</b></div>
        <div>Cashier <b>Nina K.</b></div>
        <div>Shift <b>open since 07:30</b></div>
      </div>
    </header>

    <main class="workspace">
      <section class="card order">
        <div class="order-head">
          <div class="order-title" id="order-title">Order</div>
          <div class="order-meta" id="order-meta"></div>
        </div>

        <table>
          <thead>
            <tr>
              <th class="col-qty">Qty</th>
              <th>Item</th>
              <th class="col-unit">Unit</th>
              <th class="col-amount">Amount</th>
            </tr>
          </thead>
          <tbody id="order-lines"></tbody>
        </table>

        <div class="order-foot">
          <div class="totals" id="totals"></div>
          <div class="printer-state" id="printer-state" data-tone="idle">
            <span class="dot"></span>
            <span class="printer-state-text" id="printer-state-text">Looking for the printer…</span>
          </div>
        </div>
      </section>

      <div class="payment-column">
        <section class="card payment">
          <div class="payment-block">
            <div class="payment-title">Payment</div>
            <div class="amount-due">
              <span>Amount due</span>
              <strong id="amount-due">€0.00</strong>
            </div>
            <div class="payment-note" id="payment-note"></div>
          </div>

          <div class="payment-block">
            <div class="payment-title">Method</div>
            <div class="methods">
              <button class="method" type="button" id="method-cash" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2.5" y="6" width="19" height="12" rx="2"></rect>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
                Cash
              </button>
              <button class="method" type="button" id="method-card" aria-pressed="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2.5" y="5" width="19" height="14" rx="2"></rect>
                  <path d="M2.5 10h19"></path>
                  <path d="M6 14.5h3.5"></path>
                </svg>
                Card
              </button>
            </div>
          </div>

          <div class="payment-block">
            <div class="payment-title">Receipt</div>
            <button class="print" type="button" id="print">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 9V3.5h10V9"></path>
                <path d="M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 14h10v6.5H7z"></path>
              </svg>
              Print receipt
            </button>
            <p class="print-state" id="print-state" role="status"></p>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      // The open order. The screen and the receipt use these same numbers.
      const order = {
        shopName: "Rowan & Fig Coffee",
        addressLines: ["Kastanienallee 12", "10435 Berlin"],
        number: "1042",
        place: "Table 4",
        service: "Eat in",
        time: "12:41",
        till: "2",
        cashier: "Nina K.",
        vatRate: 7,
        items: [
          { quantity: 2, name: "Flat white", note: "one with oat milk", unitPrice: 3.8 },
          { quantity: 1, name: "Filter coffee", note: "", unitPrice: 3.2 },
          { quantity: 1, name: "Double espresso", note: "", unitPrice: 2.9 },
          { quantity: 1, name: "Almond croissant", note: "warmed", unitPrice: 3.6 },
          { quantity: 2, name: "Cinnamon bun", note: "", unitPrice: 3.5 },
          { quantity: 1, name: "Mint tea", note: "fresh leaves", unitPrice: 3.4 },
          { quantity: 1, name: "Avocado toast", note: "with poached egg", unitPrice: 8.9 },
          { quantity: 1, name: "Banana bread", note: "", unitPrice: 3.9 },
          { quantity: 2, name: "Orange juice", note: "freshly pressed", unitPrice: 4.2 },
        ],
      };

      // The receipt is 42 characters wide. This is font A on 80 mm paper.
      const receiptWidth = 42;

      const totals = calculateTotals(order);

      renderOrderHead();
      renderOrderLines();
      renderTotals();

      const printerState = document.getElementById("printer-state");
      const printerStateText = document.getElementById("printer-state-text");
      const printState = document.getElementById("print-state");
      const printButton = document.getElementById("print");

      // The library fills this in. The page prints only to this printer.
      let selectedPrinter = null;
      let printing = false;

      setUpPaymentMethods();
      const client = await loadClient();
      printButton.addEventListener("click", () => { void printReceipt(); });
      await refreshPrinterState();

      // The library is a module beside this page. If it is missing, the page
      // keeps working and the printer state says that printing is off.
      async function loadClient() {
        try {
          const module = await import("../../../sdks/javascript/dist/index.js");
          return module.escpost ?? null;
        } catch {
          return null;
        }
      }

      async function refreshPrinterState() {
        if (client === null) {
          showPrinterState("warning", "Printing is off. The browser extension is not installed.");
          return;
        }
        let available = false;
        try {
          available = await client.isAvailable();
        } catch {
          available = false;
        }
        if (!available) {
          showPrinterState("warning", "Printing is off. The printer app does not answer.");
          return;
        }
        let inventory = null;
        try {
          inventory = await client.printers.list();
        } catch (error) {
          showPrinterState("error", `The printer list failed: ${messageFor(error)}`);
          return;
        }
        const printers = inventory.printers ?? [];
        if (printers.length === 0) {
          showPrinterState("warning", "No printer is set up yet.");
          return;
        }
        const connected = printers.find((printer) => printer.availability === "connected");
        selectedPrinter = connected ?? printers[0];
        if (connected === undefined) {
          showPrinterState("warning", `${selectedPrinter.name} · not reachable`);
          return;
        }
        showPrinterState("ok", `${selectedPrinter.name} · ready to print`);
      }

      async function printReceipt() {
        if (printing) return;
        if (client === null || selectedPrinter === null) {
          showPrintState("warning", "Printing is not available on this computer.");
          return;
        }
        printing = true;
        showPrintState("idle", "Sending the receipt…");
        try {
          await client.print({ printer: selectedPrinter.name, data: buildReceipt() });
          showPrintState("ok", `Receipt sent to ${selectedPrinter.name}.`);
        } catch (error) {
          showPrintState("error", `The receipt did not print: ${messageFor(error)}`);
        } finally {
          printing = false;
        }
      }

      // The receipt bytes. These are ESC/POS commands and plain text.
      function buildReceipt() {
        const parts = [];
        const escape = 0x1b;
        const groupSeparator = 0x1d;

        parts.push([escape, 0x40]); // Start the printer.
        parts.push([escape, 0x61, 0x01]); // Put the text in the middle.
        parts.push([escape, 0x21, 0x30]); // Make the text tall and wide.
        parts.push(text(`${order.shopName}\n`));
        parts.push([escape, 0x21, 0x00]); // Go back to the normal text size.
        for (const line of order.addressLines) parts.push(text(`${line}\n`));
        parts.push(text("\n"));

        parts.push([escape, 0x61, 0x00]); // Put the text on the left.
        parts.push(text(`${twoColumns(`Order ${order.number}`, order.place)}\n`));
        parts.push(text(`${twoColumns(`Till ${order.till}  ${order.cashier}`, order.time)}\n`));
        parts.push(text(`${"-".repeat(receiptWidth)}\n`));

        for (const item of order.items) {
          const label = `${item.quantity} x ${item.name}`;
          parts.push(text(`${twoColumns(label, money(item.quantity * item.unitPrice))}\n`));
        }

        parts.push(text(`${"-".repeat(receiptWidth)}\n`));
        parts.push(text(`${twoColumns("Net", money(totals.net))}\n`));
        parts.push(text(`${twoColumns(`VAT ${order.vatRate}%`, money(totals.vat))}\n`));
        parts.push([escape, 0x45, 0x01]); // Make the text bold.
        parts.push(text(`${twoColumns("TOTAL EUR", money(totals.total))}\n`));
        parts.push([escape, 0x45, 0x00]); // Stop the bold text.
        parts.push(text("\n"));

        parts.push([escape, 0x61, 0x01]); // Put the text in the middle.
        parts.push(text("Thank you. See you soon.\n"));
        parts.push([escape, 0x64, 0x04]); // Feed four lines.
        parts.push([groupSeparator, 0x56, 0x42, 0x00]); // Cut the paper.

        return join(parts);
      }

      function text(value) {
        return Array.from(new TextEncoder().encode(value));
      }

      function join(parts) {
        const bytes = [];
        for (const part of parts) bytes.push(...part);
        return new Uint8Array(bytes);
      }

      // Put the label on the left and the value on the right of one line.
      function twoColumns(label, value) {
        const room = Math.max(1, receiptWidth - value.length - 1);
        const trimmed = label.length > room ? label.slice(0, room) : label;
        const gap = receiptWidth - trimmed.length - value.length;
        return trimmed + " ".repeat(Math.max(1, gap)) + value;
      }

      function calculateTotals(currentOrder) {
        const total = currentOrder.items.reduce(
          (sum, item) => sum + item.quantity * item.unitPrice,
          0,
        );
        // The prices include the VAT, thus the net value comes out of the total.
        const vat = round(total - total / (1 + currentOrder.vatRate / 100));
        return { total: round(total), vat, net: round(round(total) - vat) };
      }

      function round(value) {
        return Math.round(value * 100) / 100;
      }

      function money(value) {
        return value.toFixed(2);
      }

      function euro(value) {
        return `€${money(value)}`;
      }

      function renderOrderHead() {
        document.getElementById("order-title").textContent = `Order ${order.number}`;
        document.getElementById("order-meta").textContent =
          `${order.place} · ${order.service} · ${order.time}`;
      }

      function renderOrderLines() {
        const body = document.getElementById("order-lines");
        for (const item of order.items) {
          const row = document.createElement("tr");

          const quantity = document.createElement("td");
          quantity.className = "col-qty";
          const pill = document.createElement("span");
          pill.className = "qty-pill";
          pill.textContent = String(item.quantity);
          quantity.append(pill);

          const name = document.createElement("td");
          const nameLine = document.createElement("div");
          nameLine.className = "item-name";
          nameLine.textContent = item.name;
          name.append(nameLine);
          if (item.note !== "") {
            const note = document.createElement("div");
            note.className = "item-note";
            note.textContent = item.note;
            name.append(note);
          }

          const unit = document.createElement("td");
          unit.className = "col-unit";
          unit.textContent = euro(item.unitPrice);

          const amount = document.createElement("td");
          amount.className = "col-amount";
          amount.textContent = euro(round(item.quantity * item.unitPrice));

          row.append(quantity, name, unit, amount);
          body.append(row);
        }
      }

      function renderTotals() {
        const box = document.getElementById("totals");
        box.append(
          totalsRow("Net", euro(totals.net)),
          totalsRow(`VAT ${order.vatRate}%`, euro(totals.vat)),
        );

        const grand = document.createElement("div");
        grand.className = "totals-row grand";
        const label = document.createElement("span");
        label.textContent = "Total";
        const value = document.createElement("span");
        value.className = "grand-amount";
        value.textContent = euro(totals.total);
        grand.append(label, value);
        box.append(grand);

        document.getElementById("amount-due").textContent = euro(totals.total);

        const pieces = order.items.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("payment-note").textContent =
          `${pieces} items · ${order.place} · ${order.service}`;
      }

      function totalsRow(label, value) {
        const row = document.createElement("div");
        row.className = "totals-row";
        const left = document.createElement("span");
        left.textContent = label;
        const right = document.createElement("span");
        right.textContent = value;
        row.append(left, right);
        return row;
      }

      function setUpPaymentMethods() {
        const methods = [document.getElementById("method-cash"), document.getElementById("method-card")];
        for (const method of methods) {
          method.addEventListener("click", () => {
            for (const other of methods) {
              other.setAttribute("aria-pressed", String(other === method));
            }
          });
        }
      }

      function showPrinterState(tone, message) {
        printerState.dataset.tone = tone;
        printerStateText.textContent = message;
      }

      function showPrintState(tone, message) {
        printState.dataset.tone = tone;
        printState.textContent = message;
      }

      function messageFor(error) {
        return error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
