[workspace]
members = [
    "crates/escpost-render",
    "crates/escpost",
    "crates/escpost-python",
    "crates/escpost-profiles",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/receiptful/escpost"
homepage = "https://escpost.dev"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
encoding_rs = "0.8.35"
escpost-profiles = { version = "0.2.0", path = "crates/escpost-profiles" }
escpost-render = { version = "0.2.0", path = "crates/escpost-render" }
fontdue = "0.9.3"
futures-core = "0.3"
if-addrs = "0.14"
indicatif = "0.18.6"
inquire = "0.9.4"
mime_guess = "2.0.5"
nusb = "0.2.5"
oem_cp = "2.1.2"
png = "0.18"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
qrcode = { version = "0.14.1", default-features = false }
rustix = { version = "1.1.4", features = ["process"] }
rust-embed = "8.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3.54", features = ["formatting"] }
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
crossterm = "0.29.0"
unicode-width = "0.2.0"
toml = "1.1"
vt100 = "0.15.2"
webbrowser = { version = "1.2.1", features = ["hardened"] }

[workspace.lints.rust]
unsafe_code = "forbid"
