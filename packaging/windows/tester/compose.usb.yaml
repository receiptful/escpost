services:
  windows:
    environment:
      ARGUMENTS: ${ESCPOST_TESTER_USB_ARGUMENTS:?Select USB devices with tester start --usb}
    labels:
      # Retain this label name for compatibility with single-device testers.
      dev.escpost.usb-device: ${ESCPOST_TESTER_USB_SELECTION:?Select USB devices}
    # A bus mount and USB-only device rule survive USB re-enumeration. QEMU
    # forwards only the selected physical ports and VID/PID pairs into Windows.
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
    device_cgroup_rules:
      - 'c 189:* rw'
