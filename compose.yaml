x-development-service: &development-service
  image: escpost-development
  network_mode: host
  build:
    context: .
    args:
      USER_ID: 1000
      GROUP_ID: 1000
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cargo-home:/home/developer/.cargo
    - cargo-target:/home/developer/target
    - python-venv:/workspace/.venv

x-frontend-service: &frontend-service
  image: oven/bun:1.3.14
  network_mode: host
  working_dir: /workspace/crates/escpost/frontend
  user: "0:0"
  entrypoint: /workspace/scripts/frontend-entrypoint
  volumes:
    - .:/workspace
    - frontend-node-modules:/workspace/crates/escpost/frontend/node_modules

services:
  # The production bundle, for the Rust tests that serve it. A profile keeps it
  # out of `docker compose up`, where it would write the node_modules volume at
  # the same time as `frontend`.
  frontend-build:
    <<: *frontend-service
    profiles:
      - tools
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]

  frontend:
    <<: *frontend-service
    depends_on:
      escpost:
        condition: service_healthy
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev"]

  test:
    <<: *development-service
    profiles:
      - tools
    depends_on:
      frontend-build:
        condition: service_completed_successfully

  # A RAW TCP printer on a network of its own, so `printers discover` has
  # something to find when no hardware is connected:
  #
  #   docker compose --profile dummy-printer up -d dummy-printer
  #
  # It deliberately does NOT use host networking, unlike every other service
  # here. A scan never probes the scanning machine's own addresses, so a
  # dummy printer sharing the host's network namespace would be excluded by
  # design and could never be discovered. On a bridge of its own the host
  # holds the gateway address and the printer holds another, which is the
  # shape discovery expects of a real printer on a real segment.
  dummy-printer:
    image: escpost-development
    build:
      context: .
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    profiles:
      - dummy-printer
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-home:/home/developer/.cargo
      - cargo-target:/home/developer/target
    networks:
      dummy-printer:
        ipv4_address: 172.31.42.2
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        cargo build --quiet --locked --package escpost
        exec "$${CARGO_TARGET_DIR}/debug/escpost" serve \
          --listen 0.0.0.0:9100 \
          --non-interactive \
          --no-open

  escpost:
    <<: *development-service
    # The test has two parts. The container uses the network of the host.
    # Thus a test of the port only can find the server of a different
    # directory. The start period gives time for the first build. The
    # server cannot listen before the build is complete.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - grep -qx escpost /proc/*/comm && echo > /dev/tcp/127.0.0.1/9000
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 600s
    environment:
      # Keep configuration used by this checkout separate from any
      # host-installed ESCPost version.
      ESCPOST_CONFIG_DIR: /home/developer/.config/escpost
    volumes:
      - .:/workspace
      - escpost-config:/home/developer/.config/escpost
      - cargo-home:/home/developer/.cargo
      - cargo-target:/home/developer/target
      # A bind mount, so device files appear and disappear as printers are
      # plugged in and out. The `devices:` key passes through only what is
      # connected when the container starts, which leaves a printer plugged
      # in later visible in /sys but impossible to open.
      - /dev/bus/usb:/dev/bus/usb
    # Lets the container read and write USB devices. A bind mount makes the
    # device files visible but grants no access to them.
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      - "${USB_GROUP_ID:-7}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${1:-}" = serve ] && [ "$${ESCPOST_WATCH:-1}" = 1 ]; then
          exec watchexec \
            --restart \
            --watch /workspace/Cargo.toml \
            --watch /workspace/Cargo.lock \
            --watch /workspace/crates/escpost/Cargo.toml \
            --watch /workspace/crates/escpost/build.rs \
            --watch /workspace/crates/escpost/src \
            --watch /workspace/crates/escpost-profiles/Cargo.toml \
            --watch /workspace/crates/escpost-profiles/profiles \
            --watch /workspace/crates/escpost-profiles/src \
            --watch /workspace/crates/escpost-render/Cargo.toml \
            --watch /workspace/crates/escpost-render/assets \
            --watch /workspace/crates/escpost-render/src \
            -- \
            cargo run --quiet --locked --package escpost -- "$$@"
        fi
        cargo build --quiet --locked --package escpost
        exec "$${CARGO_TARGET_DIR}/debug/escpost" "$$@"
      - escpost
    command:
      - serve
      - --listen
      - 127.0.0.1:9100
      - --web-listen
      - 127.0.0.1:9000
      - --no-open
      # Vite serves the web app on port 5173 and sends each /api request here.
      # Without this flag port 9000 would answer with the last built bundle,
      # which is easy to open by accident and is usually out of date.
      - --no-web-app

networks:
  # Fixed subnet so the address the dummy printer answers on is stable, and
  # narrow enough (/24) that an automatic scan will sweep it rather than skip
  # it for being too large.
  dummy-printer:
    # A readable bridge name, so discovery reports the printer as reachable
    # via `escpost-dummy` rather than via a generated hash nobody recognizes.
    driver_opts:
      com.docker.network.bridge.name: escpost-dummy
    ipam:
      config:
        - subnet: 172.31.42.0/24

volumes:
  escpost-config:
  cargo-home:
  cargo-target:
  python-venv:
  frontend-node-modules:
