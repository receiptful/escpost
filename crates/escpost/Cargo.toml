[package]
name = "escpost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The most complete ESC/POS developer toolbox for receipt and label printers."
readme = "README.md"
keywords = ["escpos", "printer", "receipt", "cli", "pos"]
categories = ["command-line-utilities", "development-tools"]

# The published crate must hold the built web app. Git ignores `frontend/dist/`,
# thus cargo leaves it out of the package by default and `build.rs` stops the
# build for the user. This list replaces the git rules. Build the frontend
# before you publish. `just publish` does the two steps in the correct order.
# A pattern without a `/` prefix finds the file at each directory level. Thus
# `/` starts each line and keeps `node_modules` out of the package.
include = [
    "/src/**/*",
    "/tests/**/*",
    "/frontend/dist/**/*",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "escpost"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
directories.workspace = true
escpost-render = { version = "0.1.0", path = "../escpost-render" }
escpost-profiles = { version = "0.1.0", path = "../escpost-profiles" }
futures-core.workspace = true
if-addrs.workspace = true
indicatif.workspace = true
inquire.workspace = true
mime_guess.workspace = true
nusb.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-embed.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
toml.workspace = true
webbrowser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# test-util unlocks tokio's mock clock (`start_paused`/`time::pause`), used to
# drive retry-delay tests deterministically instead of waiting on real time.
# Dev-only, so it never reaches the shipped binary.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
