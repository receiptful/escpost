[package]
name = "escpost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The most complete ESC/POS developer toolbox for receipt and label printers."
readme = "README.md"
keywords = ["escpos", "printer", "receipt", "cli", "pos"]
categories = ["command-line-utilities", "development-tools"]

# The published crate must hold the built web app. Git ignores `frontend/dist/`,
# thus cargo leaves it out of the package by default and `build.rs` stops the
# build for the user. This list replaces the git rules. Build the frontend
# before you publish. `just publish` does the two steps in the correct order.
# A pattern without a `/` prefix finds the file at each directory level. Thus
# `/` starts each line and keeps `node_modules` out of the package.
include = [
    "/src/**/*",
    "/tests/**/*",
    "/frontend/dist/**/*",
    # The frontend sources ship alongside the bundle above so that a consumer of
    # the crate can read and re-derive what it embeds. Nothing in the crate
    # build reads them: `build.rs` and `rust-embed` only ever touch
    # `frontend/dist/`. Downstream packaging that starts from the crate (the
    # Homebrew tap) therefore needs no Bun or Node toolchain.
    "/frontend/src/**/*",
    "/frontend/index.html",
    "/frontend/package.json",
    "/frontend/bun.lock",
    "/frontend/bunfig.toml",
    "/frontend/tsconfig.json",
    "/frontend/vite.config.ts",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "escpost"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
directories.workspace = true
escpost-render.workspace = true
escpost-profiles.workspace = true
futures-core.workspace = true
if-addrs.workspace = true
indicatif.workspace = true
inquire.workspace = true
mime_guess.workspace = true
nusb.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-embed.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
toml.workspace = true
webbrowser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# test-util unlocks tokio's mock clock (`start_paused`/`time::pause`), used to
# drive retry-delay tests deterministically instead of waiting on real time.
# Dev-only, so it never reaches the shipped binary.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
vt100.workspace = true

[lints]
workspace = true
